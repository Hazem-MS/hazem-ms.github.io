name: Check Hugo build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo extended
        run: |
          curl -fL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}" hugo
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Build production site
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Brussels
        run: hugo --gc --minify --panicOnWarning
