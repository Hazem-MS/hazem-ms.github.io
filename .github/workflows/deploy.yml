name: Publish approved site to GitHub Pages

# Publishing requires an intentional manual run with publish checked.
# Pushes and pull requests only run check.yml and cannot publish this site.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "I have reviewed the site and approve public publication"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Hugo extended
        run: |
          curl -fL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}" hugo
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Brussels
        # Canonicals use the explicit HTTPS baseURL in hugo.yaml.
        run: hugo --gc --minify --panicOnWarning
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
